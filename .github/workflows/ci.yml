name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NotaFiscalHub.sln

      - name: Build
        run: dotnet build NotaFiscalHub.sln --no-restore --configuration Release

      - name: Test (ArchitectureTests)
        run: dotnet test tests/NotaFiscalHub.ArchitectureTests --no-build --configuration Release
